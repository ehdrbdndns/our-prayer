appId: com.ehdrbdndns.ourprayerwesdlmg8pomqcxfrwnqcj
---
- launchApp:
    clearState: false

- tapOn:
    point: "92%,43%"

- extendedWaitUntil:
    visible:
      text: ".*기도 플랜.*"
    timeout: 20000

- tapOn: ".*기도 플랜.*"

- extendedWaitUntil:
    visible:
      id: "plan-tab-all"
    timeout: 20000

- tapOn:
    id: "plan-tab-free"

- tapOn:
    id: "plan-card-free-0"

- extendedWaitUntil:
    visible:
      id: "free-prayer-setup-start"
    timeout: 20000

- assertVisible:
    id: "timer-picker-list"

- tapOn:
    id: "timer-picker-list"

- repeat:
    times: 40
    commands:
      - runFlow:
          when:
            notVisible:
              text: ".*선택한 시간: 0시간 1분.*"
          commands:
            - swipe:
                start: "50%,64%"
                end: "50%,78%"
                duration: 220
            - waitForAnimationToEnd

- assertVisible:
    text: ".*선택한 시간: 0시간 1분.*"

- tapOn:
    id: "free-prayer-setup-start"

- extendedWaitUntil:
    visible:
      id: "timer-complete"
    timeout: 120000

- tapOn:
    id: "timer-complete"

- waitForAnimationToEnd

- runFlow:
    file: subflows/save_and_delete_record.yaml
    env:
      NOTE_PREFIX: "SLOW_FREE"
