appId: com.ehdrbdndns.ourprayerwesdlmg8pomqcxfrwnqcj
---
- launchApp:
    clearState: true

- runFlow: subflows/login_start_only.yaml

- tapOn:
    id: "plan-tab-topic"

- tapOn:
    id: "plan-card-topic-0"

# 이미 다운로드된 플랜이면 Alert가 보이지 않을 수 있습니다.
- runFlow:
    when:
      visible: "다운로드"
    commands:
      - tapOn: "다운로드"

- extendedWaitUntil:
    visible:
      id: "plan-detail-start"
    timeout: 240000

- tapOn:
    id: "plan-detail-lecture-0"

- tapOn:
    id: "plan-detail-start"

- extendedWaitUntil:
    visible:
      id: "timer-complete"
    timeout: 180000

- tapOn:
    id: "timer-complete"

- extendedWaitUntil:
    visible:
      id: "prayer-record-input"
    timeout: 120000

- tapOn:
    id: "prayer-record-input"

- inputText: "테스트라고 기록"

- tapOn:
    id: "prayer-record-save"
