appId: com.ehdrbdndns.ourprayerwesdlmg8pomqcxfrwnqcj
---
- launchApp:
    clearState: true

- runFlow: subflows/login_start_only.yaml

- tapOn:
    point: "92%,43%"

- tapOn:
    text: ".*시작하기.*"
    optional: true

- tapOn:
    text: ".*나중에.*"
    optional: true

- tapOn: ".*기도 플랜.*"

- extendedWaitUntil:
    visible:
      id: "plan-tab-all"
    timeout: 20000

- tapOn:
    id: "plan-tab-topic"

- tapOn:
    id: "plan-card-topic-0"

# 이미 다운로드된 플랜이면 Alert가 보이지 않을 수 있습니다.
- runFlow:
    when:
      visible: ".*다운로드.*"
    commands:
      - tapOn:
          text: ".*다운로드.*"
          below: ".*플랜을 다운로드 하시겠습니까.*"
      - assertNotVisible: ".*플랜을 다운로드 하시겠습니까.*"

- extendedWaitUntil:
    visible:
      id: "plan-detail-start"
    timeout: 20000

- tapOn:
    id: "plan-detail-start"

- extendedWaitUntil:
    visible:
      id: "lecture-prayer-quit"
    timeout: 20000

- tapOn:
    id: "lecture-prayer-quit"

- tapOn:
    text: ".*그만두기.*"
    below: ".*기도 기록 페이지로 넘어갑니다.*"

- waitForAnimationToEnd

- runFlow:
    file: subflows/save_and_delete_record.yaml
    env:
      NOTE_PREFIX: "SMOKE_NONFREE"
